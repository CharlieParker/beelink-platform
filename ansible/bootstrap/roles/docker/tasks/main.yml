---
# Docker install, plus the apt-repo/package-hold/dpkg cleanup this box needed
# historically. Kept together because the cleanup tasks exist *because of*
# Docker's install history here, not as generic host hygiene.
#
# Note: intentionally hand-rolled rather than a Galaxy role (e.g.
# geerlingguy.docker). That role's value is mostly in setting up Docker Inc's
# own apt repo for docker-ce — the opposite of the deliberate choice here to
# install the Ubuntu-distro `docker.io` package instead, to avoid containerd
# API-version conflicts with k3d (see docs/digi2al-dna-prep.md §6). Adopting
# it would mean overriding most of what it does, for no net simplification.
#
# Docker itself is deliberately left unpinned here — it tracks whatever
# version Ubuntu's own `docker.io` package ships, the same way Trivy tracks
# its own apt repo rather than a fixed version (decision recorded 2026-09-05).

- name: Remove any existing Docker apt sources and keyrings
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/docker.list
    - /etc/apt/sources.list.d/docker.list.save
    - /etc/apt/sources.list.d/docker-ce.list
    - /etc/apt/sources.list.d/docker-ce.list.save
    - /etc/apt/sources.list.d/download_docker_com_linux_ubuntu.list
    - /etc/apt/sources.list.d/download_docker_com_linux_ubuntu.list.save
    - /etc/apt/sources.list.d/docker.sources
    - /etc/apt/sources.list.d/docker.sources.save
    - /usr/share/keyrings/docker-ce.gpg
    - /etc/apt/keyrings/docker.gpg

- name: Remove Docker repo from main sources.list if present
  lineinfile:
    path: /etc/apt/sources.list
    regexp: '^deb .*download\.docker\.com'
    state: absent

- name: Update apt cache
  apt:
    update_cache: true
    cache_valid_time: 3600

- name: Show held packages
  command: apt-mark showhold
  register: held_packages
  changed_when: false

- name: Unhold held packages (if any)
  command: apt-mark unhold "{{ item }}"
  loop: "{{ held_packages.stdout_lines }}"
  register: unhold_results
  when: held_packages.stdout_lines | length > 0
  changed_when: true

- name: Fail if any unhold operation failed
  fail:
    msg: >-
      One or more packages could not be unheld: {{ failed_unholds | join(', ') }}.
      Please inspect the node and unhold them manually.
  vars:
    failed_unholds: >-
      {{ (unhold_results.results
          | selectattr('rc', 'ne', 0)
          | map(attribute='item')
          | list) if (unhold_results is defined) else [] }}
  when: unhold_results is defined and
        (unhold_results.results | selectattr('rc', 'ne', 0) | list | length) > 0

- name: Check dpkg audit for broken packages
  command: dpkg -C
  register: dpkg_audit
  changed_when: false

- name: Repair dpkg/apt state if dpkg audit reports problems
  command: /bin/bash -lc "apt-get -f install -y && dpkg --configure -a"
  when: dpkg_audit.stdout != ""
  register: dpkg_repair
  changed_when: "'installed' in dpkg_repair.stdout or dpkg_repair.rc == 0"

- name: Purge known conflicting Docker Inc and plugin packages
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-ce-rootless-extras
      - docker-compose-plugin
      - docker-buildx-plugin
    state: absent
    purge: true
    autoremove: true
    update_cache: true

- name: Ensure apt cache is fresh after removals
  apt:
    update_cache: true
    cache_valid_time: 0

- name: Install Docker from Ubuntu repository (docker.io stack)
  apt:
    name:
      - docker.io
      - docker-compose-v2
      - docker-buildx
    state: present
    update_cache: true
  notify: Restart docker

- name: Ensure Docker service is enabled and running
  systemd:
    name: docker
    enabled: true
    state: started

- name: Add ansible user to docker group
  user:
    name: ansible
    groups: docker
    append: true
