---
# Helm and AWS CLI v2 — the two tools flagged 2026-09-05 as having the same
# install-once-then-freeze shape as the original kubectl/k3d/Argo CD bug
# (curl|bash or an unversioned URL, gated only by `creates:`, so editing a
# version var did nothing). Fixed the same way: fetch the exact pinned
# release every run, verify the installed version actually matches it.

- name: Ensure a scratch directory for archive downloads exists
  file:
    path: /opt/download-cache
    state: directory
    mode: '0755'

# --- Helm ---
# Deliberately NOT the `curl https://get-helm-3 | bash` installer script this
# replaces — piping a remote script into bash is exactly the pattern MOD's
# Secure by Design framing calls out ("no casual curl | bash"), and a direct,
# pinned tarball download is no harder. Helm 3, not 4: v4 shipped Nov 2025,
# but v3 is what real teams are still overwhelmingly running today. v3's
# security-fix window closes 2026-11-11 — revisit this pin before then.

- name: Download and extract Helm {{ helm_version }}
  unarchive:
    src: "https://get.helm.sh/helm-{{ helm_version }}-linux-amd64.tar.gz"
    dest: /opt/download-cache
    remote_src: true

- name: Install helm binary to /usr/local/bin
  copy:
    src: /opt/download-cache/linux-amd64/helm
    dest: /usr/local/bin/helm
    mode: '0755'
    owner: root
    group: root
    remote_src: true

- name: Verify helm version matches the pin
  command: /usr/local/bin/helm version --short
  register: helm_verify
  changed_when: false
  failed_when: helm_version not in helm_verify.stdout

# --- AWS CLI v2 ---
# The installer script itself needs different handling for a fresh install
# vs. re-running over an existing one (`--update`) — and note this is NOT
# the `aws update` CLI subcommand, which would fetch AWS's own idea of
# "latest" and defeat the pin entirely.

- name: Check if AWS CLI is already installed
  stat:
    path: /usr/local/bin/aws
  register: aws_stat
  changed_when: false

- name: Download AWS CLI v2 installer ({{ aws_cli_version }})
  get_url:
    url: "https://awscli.amazonaws.com/awscli-exe-linux-x86_64-{{ aws_cli_version }}.zip"
    dest: /opt/download-cache/awscliv2.zip
    mode: '0644'
    force: true

- name: Unarchive AWS CLI v2 installer
  unarchive:
    src: /opt/download-cache/awscliv2.zip
    dest: /opt/download-cache
    remote_src: true

- name: Run AWS CLI v2 installer (fresh install)
  command: /opt/download-cache/aws/install
  when: not aws_stat.stat.exists

- name: Run AWS CLI v2 installer (update existing install)
  command: /opt/download-cache/aws/install --update
  when: aws_stat.stat.exists

- name: Verify AWS CLI version matches the pin
  command: aws --version
  register: aws_verify
  changed_when: false
  failed_when: aws_cli_version not in aws_verify.stdout
