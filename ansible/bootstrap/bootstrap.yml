---
- name: Bootstrap BeeLink DevOps Platform Node
  hosts: beelink
  become: true

  vars:
    terraform_version: "1.16.1"
    kubectl_version: "v1.37.0"
    k3d_version: "v5.9.0"
    argocd_version: "v3.5.2"
    # trivy: intentionally NOT version-pinned here. It's installed via its own apt
    # repo (see the Trivy install tasks below), and a scanner benefits from tracking
    # latest signatures/checks rather than a stale pin. Decision recorded 2026-09-05.
    k3s_version: "v1.36.3+k3s1"  # target for k3d cluster creation once that exists;
                                  # paired with kubectl above to stay within the
                                  # supported one-minor-version client/server skew
    helm_version: "v3.21.4"  # Helm 3, not 4 (v4 released Nov 2025) — real teams are
                              # still overwhelmingly on v3; its security-fix window
                              # closes 2026-11-11, revisit this pin before then.
                              # Checked against github.com/helm/helm/releases 2026-09-05.
    aws_cli_version: "2.36.4"  # no leading "v" — matches both the download URL and
                                # `aws --version` output. Checked against the aws-cli
                                # v2 CHANGELOG.rst 2026-09-05.
    localstack_version: "2026.5.0"  # confirmed via `pip3 show localstack` on the box
                                      # itself 2026-09-05 (couldn't get a reliable
                                      # current figure from PyPI's API remotely, so
                                      # pinned to what's already installed and working
                                      # rather than guess — see roles/hashicorp).
    checkov_version: "3.2.529"  # same reasoning, confirmed via `pip3 show checkov`.

  # Refactored into roles 2026-09-05 (Rung 1). Only the final cross-cutting
  # verification loop and patch-status-adjacent bits stay as plain tasks
  # below, since they check *everything* the roles above installed rather
  # than belonging to any one of them. Roles always run before a play's own
  # tasks: list, regardless of file order.
  roles:
    - common
    - docker
    - k8s_tools
    - cli_tools
    - hashicorp
    - security_tools
    - updates

  tasks:

    - name: Verify installed tools (looped checks)
      vars:
        verify_cmds:
          - name: kubectl
            cmd: /usr/local/bin/kubectl version --client --output=json || /usr/local/bin/kubectl version --client
          - name: k3d
            cmd: /usr/local/bin/k3d version
          - name: terraform
            cmd: terraform -version
          - name: trivy
            cmd: trivy --version
          - name: argocd
            cmd: /usr/local/bin/argocd version --client
          - name: checkov
            cmd: checkov --version
          - name: helm
            cmd: /usr/local/bin/helm version --short
          - name: aws
            cmd: aws --version
      when: verify_cmds is defined
      block:
        - name: Run verification commands
          command: "{{ item.cmd }}"
          loop: "{{ verify_cmds }}"
          register: verify_results
          changed_when: false

    - name: Fail if any verification command failed
      fail:
        msg: >-
          One or more verification commands failed. See verify_results for details.
      when: (verify_results.results | selectattr('rc', 'ne', 0) | list | length) > 0

    - name: Display verification results
      debug:
        var: verify_results.results
