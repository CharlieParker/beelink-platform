---
- name: Bootstrap BeeLink DevOps Platform Node
  hosts: beelink
  become: true

  vars:
    terraform_version: "1.16.1"
    kubectl_version: "v1.37.0"
    k3d_version: "v5.9.0"
    argocd_version: "v3.5.2"
    # trivy: intentionally NOT version-pinned here. It's installed via its own apt
    # repo (see the Trivy install tasks below), and a scanner benefits from tracking
    # latest signatures/checks rather than a stale pin. Decision recorded 2026-09-05.
    k3s_version: "v1.36.3+k3s1"  # target for k3d cluster creation once that exists;
                                  # paired with kubectl above to stay within the
                                  # supported one-minor-version client/server skew

  # Docker install/hygiene and generic host prerequisites are now roles
  # (extracted 2026-09-05 — Rung 1). Everything below "roles:" that hasn't
  # been migrated yet (kubectl/k3d/argocd, Helm, Terraform, AWS CLI,
  # LocalStack, Trivy, Checkov, verification, patch-status reporting) stays
  # as plain tasks for now and moves into its own role incrementally, the
  # same way docker/common just did. Roles always run before a play's own
  # tasks: list, regardless of file order, so this is safe as-is.
  roles:
    - common
    - docker

  tasks:

    - name: Check if kubectl exists
      stat:
        path: /usr/local/bin/kubectl
      register: kubectl_stat
      changed_when: false

    - name: Download kubectl binary
      get_url:
        url: "https://dl.k8s.io/release/{{ kubectl_version }}/bin/linux/amd64/kubectl"
        dest: /usr/local/bin/kubectl
        mode: '0755'
        owner: root
        group: root
        force: true

    - name: Check if k3d exists
      stat:
        path: /usr/local/bin/k3d
      register: k3d_stat
      changed_when: false

    - name: Download k3d binary
      get_url:
        url: "https://github.com/k3d-io/k3d/releases/download/{{ k3d_version }}/k3d-linux-amd64"
        dest: /usr/local/bin/k3d
        mode: '0755'
        owner: root
        group: root
        force: true

    - name: Check if argocd exists
      stat:
        path: /usr/local/bin/argocd
      register: argocd_stat
      changed_when: false

    - name: Download Argo CD CLI binary
      get_url:
        url: "https://github.com/argoproj/argo-cd/releases/download/{{ argocd_version }}/argocd-linux-amd64"
        dest: /usr/local/bin/argocd
        mode: '0755'
        owner: root
        group: root
        force: true

    - name: Verify kubectl (try JSON output then fallback)
      when: kubectl_stat.stat.exists
      block:
        - name: Run kubectl version --client --output=json
          command: /usr/local/bin/kubectl version --client --output=json
          register: kubectl_verify_json
          changed_when: false
          failed_when: false

        - name: Run kubectl version --client (fallback)
          command: /usr/local/bin/kubectl version --client
          register: kubectl_verify_plain
          changed_when: false
          failed_when: false
          when: kubectl_verify_json.rc != 0

        - name: Fail if kubectl verification failed
          fail:
            msg: >-
              kubectl verification failed. JSON rc={{ kubectl_verify_json.rc }},
              plain rc={{ kubectl_verify_plain.rc | default('N/A') }}.
              json_out={{ kubectl_verify_json.stdout | default('') }},
              plain_out={{ kubectl_verify_plain.stdout | default('') }}.
          when: kubectl_verify_json.rc != 0 and
                (kubectl_verify_plain is not defined or kubectl_verify_plain.rc != 0)
      rescue:
        - name: Debug kubectl verify outputs on rescue
          debug:
            msg: >-
              kubectl json rc={{ kubectl_verify_json.rc | default('undef') }},
              stdout={{ kubectl_verify_json.stdout | default('') }},
              stderr={{ kubectl_verify_json.stderr | default('') }};
              kubectl plain rc={{ kubectl_verify_plain.rc | default('undef') }},
              stdout={{ kubectl_verify_plain.stdout | default('') }},
              stderr={{ kubectl_verify_plain.stderr | default('') }}.

    - name: Verify k3d is executable
      command: /usr/local/bin/k3d version
      register: k3d_ver
      changed_when: false
      failed_when: k3d_ver.rc != 0
      when: k3d_stat.stat.exists

    - name: Verify argocd is executable
      command: /usr/local/bin/argocd version --client
      register: argocd_ver
      changed_when: false
      failed_when: argocd_ver.rc != 0
      when: argocd_stat.stat.exists

    - name: Install Helm (idempotent via creates)
      shell: curl -fsSL https://raw.githubusercontent.com/helm/helm/master/scripts/get-helm-3 | bash
      args:
        creates: /usr/local/bin/helm

    - name: Install Terraform
      unarchive:
        src: >-
          {{ 'https://releases.hashicorp.com/terraform/' ~ terraform_version
            ~ '/terraform_' ~ terraform_version ~ '_linux_amd64.zip' }}
        dest: /usr/local/bin
        remote_src: true

    - name: Install LocalStack via pip
      pip:
        name: localstack
        executable: pip3

    - name: Install AWS CLI v2
      shell: >
        curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip &&
        unzip -o /tmp/awscliv2.zip -d /tmp &&
        /tmp/aws/install
      args:
        creates: /usr/local/bin/aws

    - name: Add Trivy APT key
      apt_key:
        url: https://get.trivy.dev/deb/public.key
        state: present

    - name: Add Trivy APT repository
      apt_repository:
        repo: "deb https://get.trivy.dev/deb generic main"
        filename: trivy
        state: present

    - name: Update apt cache for Trivy repo
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install Trivy from APT repository
      apt:
        name: trivy
        state: present

    - name: Verify Trivy is installed
      command: trivy --version
      register: trivy_verify
      changed_when: false
      failed_when: trivy_verify.rc != 0

    - name: Install Checkov
      pip:
        name: checkov
        executable: pip3

    - name: Verify installed tools (looped checks)
      vars:
        verify_cmds:
          - name: kubectl
            cmd: /usr/local/bin/kubectl version --client --output=json || /usr/local/bin/kubectl version --client
          - name: k3d
            cmd: /usr/local/bin/k3d version
          - name: terraform
            cmd: terraform -version
          - name: trivy
            cmd: trivy --version
          - name: argocd
            cmd: /usr/local/bin/argocd version --client
          - name: checkov
            cmd: checkov --version
      when: verify_cmds is defined
      block:
        - name: Run verification commands
          command: "{{ item.cmd }}"
          loop: "{{ verify_cmds }}"
          register: verify_results
          changed_when: false

    - name: Check for pending package upgrades
      command: apt list --upgradable
      register: pending_upgrades
      changed_when: false

    - name: Check whether a reboot is required
      stat:
        path: /var/run/reboot-required
      register: reboot_required_stat
      changed_when: false

    - name: Report patch status
      debug:
        msg: >-
          {{ (pending_upgrades.stdout_lines | length) - 1 }} package(s) upgradable.
          Reboot required: {{ reboot_required_stat.stat.exists }}

    - name: Fail if any verification command failed
      fail:
        msg: >-
          One or more verification commands failed. See verify_results for details.
      when: (verify_results.results | selectattr('rc', 'ne', 0) | list | length) > 0

    - name: Display verification results
      debug:
        var: verify_results.results
